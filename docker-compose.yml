services:
  db:
    image: postgres:13
    container_name: etlancer-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-etlancer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: etlancer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-etlancer}
      PREFECT_API_URL: http://prefect-server:4200/api
      API_KEY: ${API_KEY:-dev-api-key-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-cYFNSivrrSI20TZVNxKKJvgJsfx9sDvtAtljDMUAtTc=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: etlancer-prefect
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api

  frontend:
    build: ./frontend
    container_name: etlancer-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_API_KEY: ${API_KEY:-dev-api-key-change-me}
    depends_on:
      - backend

volumes:
  postgres_data:
